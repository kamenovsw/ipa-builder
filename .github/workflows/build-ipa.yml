name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repo a compilar (owner/nombre)"
        required: true
      ref:
        description: "Rama, tag o commit"
        required: false
        default: "main"
      app_dir:
        description: "Carpeta dentro del repo donde esta el proyecto Expo"
        required: false
        default: "."
      ipa_name:
        description: "Nombre del artefacto .ipa resultante"
        required: false
        default: "app-unsigned"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout target project
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          path: target

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: target/${{ inputs.app_dir }}
        run: npm install

      - name: Expo prebuild
        working-directory: target/${{ inputs.app_dir }}
        env:
          CI: 1
        run: npx expo prebuild --platform ios

      - name: Install Pods
        working-directory: target/${{ inputs.app_dir }}/ios
        run: pod install

      - name: Find workspace
        id: workspace
        working-directory: target/${{ inputs.app_dir }}
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" | head -n 1)
          SCHEME=$(basename $(find ios -name "*.xcodeproj" | head -n 1) .xcodeproj)
          echo "workspace=$WORKSPACE" >> $GITHUB_OUTPUT
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT

      - name: Build iOS
        working-directory: target/${{ inputs.app_dir }}
        run: |
          xcodebuild \
            -workspace "${{ steps.workspace.outputs.workspace }}" \
            -scheme "${{ steps.workspace.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create IPA
        working-directory: target/${{ inputs.app_dir }}
        run: |
          mkdir Payload
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" | head -n 1)
          cp -R "$APP" Payload
          zip -r "${{ inputs.ipa_name }}.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.ipa_name }}
          path: "**/${{ inputs.ipa_name }}.ipa"
