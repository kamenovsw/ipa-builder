name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repo a compilar (owner/nombre)"
        required: true
      ref:
        description: "Rama, tag o commit"
        required: false
        default: "main"
      app_dir:
        description: "Carpeta dentro del repo donde esta el proyecto Expo"
        required: false
        default: "."
      ipa_name:
        description: "Nombre del artefacto .ipa resultante"
        required: false
        default: "app-unsigned"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout target project
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          path: target

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install dependencies
        working-directory: target/${{ inputs.app_dir }}
        run: npm ci || npm install

      - name: Install Expo CLI
        run: npm install -g expo-cli

      - name: Clean Expo Prebuild
        working-directory: target/${{ inputs.app_dir }}
        env:
          CI: 1
        run: |
          rm -rf ios
          npx expo prebuild --platform ios --clean

      - name: Install Pods
        working-directory: target/${{ inputs.app_dir }}/ios
        run: |
          pod repo update
          pod install --repo-update

      - name: Find workspace
        id: workspace
        working-directory: target/${{ inputs.app_dir }}
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" | head -n 1)
          SCHEME=$(basename $(find ios -name "*.xcodeproj" | head -n 1) .xcodeproj)

          echo "workspace=$WORKSPACE" >> $GITHUB_OUTPUT
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT

          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

      - name: Build iOS
        working-directory: target/${{ inputs.app_dir }}
        run: |
          xcodebuild \
            -workspace "${{ steps.workspace.outputs.workspace }}" \
            -scheme "${{ steps.workspace.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Create IPA
        working-directory: target/${{ inputs.app_dir }}
        run: |
          mkdir -p Payload

          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" | head -n 1)

          echo "APP FOUND:"
          echo "$APP"

          cp -R "$APP" Payload/

          zip -r "${{ inputs.ipa_name }}.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.ipa_name }}
          path: target/${{ inputs.app_dir }}/${{ inputs.ipa_name }}.ipa
