name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repositorio do aplicativo"
        required: true
        type: string
      ref:
        description: "Branch do aplicativo"
        required: false
        default: "main"
        type: string
      app_dir:
        description: "Pasta do aplicativo"
        required: false
        default: "."
        type: string
      ipa_name:
        description: "Nome do IPA"
        required: false
        default: "SyncPay"
        type: string

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout target project
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          path: target
          token: ${{ secrets.SYNC_PAY_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: target/${{ inputs.app_dir }}
        run: npm install

      - name: Expo prebuild
        working-directory: target/${{ inputs.app_dir }}
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: target/${{ inputs.app_dir }}/ios
        run: pod install --repo-update

      - name: Build unsigned iOS app
        id: build
        working-directory: target/${{ inputs.app_dir }}/ios
        shell: bash
        run: |
          set -e
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" -print -quit)
          if [ -z "$WORKSPACE" ]; then
            echo "Erro: nenhum workspace Xcode encontrado."
            exit 1
          fi
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE"
          echo "Scheme
